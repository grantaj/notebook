name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
