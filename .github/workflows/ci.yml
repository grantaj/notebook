name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: cat uv.lock
