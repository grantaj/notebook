<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notebook</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20201e;background:#f6f4ee;line-height:1.55;--line:#dedbd2;--paper:#fffefb;--muted:#77736b}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr)}aside{border-right:1px solid var(--line);padding:1rem;min-height:100vh;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:750;font-size:1.05rem}.repo{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere;margin:.2rem 0 1.25rem}.pages{display:grid;gap:.25rem}.page-link{display:block;width:100%;text-align:left;border:0;background:transparent;padding:.62rem .68rem;border-radius:.55rem;font:inherit;color:inherit;cursor:pointer}.page-link:hover,.page-link.active{background:#ebe8df}.page-link small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.08rem}main{min-width:0;padding:1.1rem 1.4rem 8rem}.topline{display:flex;align-items:center;justify-content:space-between;gap:1rem;max-width:900px;margin:0 auto .8rem}.path{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:.4rem}.ghost{border:1px solid var(--line);background:transparent;color:inherit;border-radius:.55rem;padding:.45rem .65rem;cursor:pointer}.page{max-width:900px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:.75rem;padding:1.5rem 1.7rem;min-height:55vh;overflow-wrap:anywhere}.page h1:first-child{margin-top:0}.page pre{overflow:auto;background:#f1efe8;padding:.85rem;border-radius:.5rem}.page img{max-width:100%;height:auto}.source{max-width:900px;margin:1rem auto}.source summary{cursor:pointer;color:var(--muted);font-size:.85rem}.source textarea{margin-top:.55rem;min-height:45vh;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.composer{position:fixed;left:max(280px,calc((100vw - 1180px)/2 + 280px));right:0;bottom:0;padding:.7rem max(1rem,calc((100vw - 1180px)/2));background:color-mix(in srgb,#f6f4ee 96%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(10px)}.composer form{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:.55rem;align-items:end}.composer textarea,.source textarea{width:100%;resize:vertical;border:1px solid #c9c5ba;border-radius:.65rem;background:#fff;padding:.78rem;font:inherit}.composer textarea{max-height:28vh}.send{border:0;border-radius:.65rem;background:#222;color:#fff;padding:.78rem 1rem;font-weight:700;cursor:pointer}.send:disabled{opacity:.45;cursor:default}.status{max-width:900px;margin:.3rem auto 0;font-size:.76rem;color:var(--muted);min-height:1.2em}.empty{color:var(--muted);padding:2rem}.mobile-title{display:none}@media(max-width:720px){.shell{display:block}aside{position:static;height:auto;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:.75rem}.brand,.repo{display:inline}.repo{margin-left:.5rem}.pages{display:flex;overflow-x:auto;margin-top:.65rem;padding-bottom:.15rem}.page-link{min-width:max-content;border:1px solid var(--line);padding:.4rem .6rem}.page-link small{display:none}main{padding:.7rem .75rem 7rem}.page{border-left:0;border-right:0;border-radius:0;margin-left:-.75rem;margin-right:-.75rem;padding:1rem}.composer{left:0;padding:.65rem .75rem env(safe-area-inset-bottom)}.composer form{grid-template-columns:1fr auto}.topline{margin-bottom:.55rem}.path{display:none}.mobile-title{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}@media(prefers-color-scheme:dark){:root{color:#e8e6df;background:#1d1d1b;--line:#3a3934;--paper:#242421;--muted:#aaa69c}.page-link:hover,.page-link.active{background:#31302c}.page pre{background:#191917}.ghost{background:#242421}.composer{background:color-mix(in srgb,#1d1d1b 96%,transparent)}.composer textarea,.source textarea{background:#252522;color:#eee;border-color:#484741}.send{background:#eee;color:#171717}}
</style>
<script>window.MathJax={tex:{inlineMath:[["$","$"],["\\(","\\)"]]},svg:{fontCache:"global"}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">Notebook</div><div id="repo" class="repo"></div>
    <nav id="pages" class="pages" aria-label="Notebook pages"></nav>
  </aside>
  <main>
    <div class="topline"><div><span id="mobile-title" class="mobile-title"></span><span id="path" class="path"></span></div><div class="actions"><button id="fullscreen" class="ghost" type="button">Fullscreen</button></div></div>
    <article id="page" class="page"><div class="empty">Opening notebook…</div></article>
    <details class="source"><summary>Source</summary><textarea id="source" spellcheck="false"></textarea><button id="save" class="ghost" type="button">Commit edit</button></details>
  </main>
</div>
<section class="composer">
  <form id="ask-form"><textarea id="message" rows="2" placeholder="Write or ask…" required></textarea><button id="send" class="send" type="submit">Ask</button></form>
  <div id="status" class="status"></div>
</section>
<script>
const state={repo:"",pages:[],path:null,page:null,hosted:Boolean(window.openai)};
const $=id=>document.getElementById(id);
function status(text){$("status").textContent=text||""}
function escapeHtml(text){return String(text).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderNav(){
  $("repo").textContent=state.repo;
  $("pages").innerHTML=state.pages.map(p=>`<button class="page-link ${p.path===state.path?"active":""}" data-path="${escapeHtml(p.path)}"><span>${escapeHtml(p.title)}</span><small>${escapeHtml(p.path)}</small></button>`).join("");
  document.querySelectorAll(".page-link").forEach(button=>button.onclick=()=>openPage(button.dataset.path));
}
function renderPage(page){
  state.page=page;state.path=page.path;$("path").textContent=page.path;$("mobile-title").textContent=page.title;$("page").innerHTML=page.rendered||`<pre>${escapeHtml(page.source||"")}</pre>`;$("source").value=page.source||"";renderNav();
  if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([$("page")]);
}
async function localJson(url,options){const response=await fetch(url,options);if(!response.ok){let detail=response.statusText;try{detail=(await response.json()).detail||detail}catch{}throw new Error(detail)}return response.json()}
async function loadLocal(){const snap=await localJson("/api/notebook");state.repo=snap.repo;state.pages=snap.pages;$("send").disabled=!snap.aiEnabled;status(snap.aiBackend);const requested=new URLSearchParams(location.search).get("page");await openPage(requested||snap.defaultPath)}
async function openPage(path){if(!path)return;if(window.openai?.callTool){status("Opening…");try{const result=await window.openai.callTool("open_notebook_page",{path});if(result?.structuredContent?.page){renderPage(result.structuredContent.page);status("");return}}catch(err){status(String(err.message||err))}}if(state.hosted){state.path=path;renderNav();status("Ask ChatGPT to open this page.");return}const page=await localJson(`/api/page?path=${encodeURIComponent(path)}`);history.replaceState(null,"",`/?page=${encodeURIComponent(path)}`);renderPage(page);status(page.aiBackend||"")}
$("ask-form").addEventListener("submit",async event=>{event.preventDefault();const message=$("message").value.trim();if(!message||!state.path)return;if(window.openai?.sendFollowUpMessage){status("Continuing in ChatGPT…");await window.openai.sendFollowUpMessage({prompt:`Continue the Notebook thread in ${state.path}. ${message}`});$("message").value="";status("");return}$("send").disabled=true;status("Thinking with Codex…");try{const page=await localJson("/api/continue",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:state.path,message})});$("message").value="";renderPage(page);status(`Committed via ${page.aiBackend}`)}catch(err){status(err.message||String(err))}finally{$("send").disabled=false}});
$("save").onclick=async()=>{if(state.hosted){status("Edit through the surrounding ChatGPT conversation for now.");return}status("Committing edit…");try{const page=await localJson("/api/edit",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:state.path,source:$("source").value})});renderPage(page);status("Committed")}catch(err){status(err.message||String(err))}};
$("fullscreen").onclick=async()=>{if(window.openai?.requestDisplayMode){await window.openai.requestDisplayMode({mode:"fullscreen"});return}if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.()};
function applyHosted(output){if(!output)return;state.hosted=true;state.repo=output.repo||state.repo;state.pages=output.pages||state.pages;if(output.page)renderPage(output.page);else renderNav();status("ChatGPT")}
if(window.openai?.toolOutput)applyHosted(window.openai.toolOutput);else loadLocal().catch(err=>{$("page").innerHTML=`<div class="empty">${escapeHtml(err.message||String(err))}</div>`;status("Could not open notebook")});
window.addEventListener("openai:set_globals",event=>applyHosted(event.detail?.globals?.toolOutput));
</script>
</body>
</html>
