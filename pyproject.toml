[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-notebook"
version = "0.0.1"
description = "A notebook-first usability layer over an ordinary GitHub repository"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notebook_app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
